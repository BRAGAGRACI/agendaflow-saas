<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Mestre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f4f7fa;
      color: #333;
      font-family: 'Inter', sans-serif;
    }

    .navbar {
      background-color: #00011a;
      box-shadow: 0 2px 12px rgba(0, 224, 255, 0.2);
    }

    .navbar-brand {
      font-weight: 600;
      color: #00e0ff !important;
      text-shadow: 0 0 5px #00e0ff;
    }

    .neon-btn {
      background-color: #00e0ff;
      border: none;
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 10px #00e0ff, 0 0 20px #00e0ff;
      margin-right: 10px;
    }

    .neon-btn:hover {
      background-color: #ff00c8;
      color: #fff;
      box-shadow: 0 0 15px #ff00c8, 0 0 25px #ff00c8;
    }

    .ai-banner h1 {
      color: #00e0ff;
      text-shadow: 0 0 6px #00e0ff;
      font-weight: bold;
    }

    .ai-banner p {
      font-size: 1.2rem;
      margin-top: 10px;
      color: #cceeff;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      padding: 20px 0;
      color: #999;
      font-size: 0.9em;
      border-top: 1px solid #ddd;
      background-color: #fff;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg mb-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="{% url 'home' %}">🤖 BragaTech - AgendaFlow</a>
      <div>
        <a href="{% url 'novo_agendamento' %}" class="btn neon-btn">Novo Agendamento</a>
        <a href="{% url 'listar_agendamentos' %}" class="btn neon-btn">Listar Agendamentos</a>
        <a href="{% url 'agenda' %}" class="btn neon-btn">Agenda Detalhada</a>
        <a href="{% url 'agenda_diaria' %}" class="btn neon-btn">Agenda Diária</a>
         <a href="{% url 'teste_email_personalizado' %}" class="btn neon-btn">Lembretes Agendamento</a>
        <a href="{% url 'nova_venda' %}" class="btn neon-btn">Venda</a>
         <a href="{% url 'pagamento' %}" class="btn neon-btn">Pagamento</a>

      </div>
    </div>
  </nav>

  <!-- Conteúdo da página -->
  <div class="container">
    {% block content %}
    {% endblock %}
  </div>
<style>
  body {
    background-color: #f4f7fa;
    color: #333;
    font-family: 'Inter', sans-serif;
  }

  .navbar {
    background: linear-gradient(to right, #00011a, #001f3f, #003366);
    box-shadow: 0 2px 12px rgba(0, 224, 255, 0.3);
    border-bottom: 2px solid #00e0ff;
  }

  .navbar-brand {
    font-weight: 600;
    color: #00e0ff !important;
    text-shadow: 0 0 5px #00e0ff;
  }

  .neon-btn {
    background-color: #00e0ff;
    border: none;
    color: #000;
    font-weight: bold;
    box-shadow: 0 0 10px #00e0ff, 0 0 20px #00e0ff;
    margin-right: 10px;
    transition: all 0.3s ease-in-out;
  }

  .neon-btn:hover {
    background-color: #ff00c8;
    color: #fff;
    box-shadow: 0 0 15px #ff00c8, 0 0 25px #ff00c8;
    transform: scale(1.05);
  }

  .ai-banner h1 {
    color: #00e0ff;
    text-shadow: 0 0 6px #00e0ff;
    font-weight: bold;
  }

  .ai-banner p {
    font-size: 1.2rem;
    margin-top: 10px;
    color: #cceeff;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    padding: 20px 0;
    color: #999;
    font-size: 0.9em;
    border-top: 1px solid #ddd;
    background-color: #fff;
  }
</style>

  <footer>
    <small>Desenvolvido por BragaTech — Todos os direitos reservado. @2025 📘</small>
  </footer>

  <!-- Bootstrap CSS -->


<!-- Bootstrap JS -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
